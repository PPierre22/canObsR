# Python environment of canObsR / canobspy (created by canObsR::canobs_setup()).
# Short list on purpose: conda-forge resolves the dependencies for each system (Windows, macOS, Linux).
name: canobs
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pillow
  - gdal>=3.10
  - arosics>=1.14
  - pip
