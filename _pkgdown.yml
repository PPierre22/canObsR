url: https://umr-amap.github.io/canobsR/

template:
  bootstrap: 5
  bootswatch: flatly
  light-switch: true
  includes:
    in_header: pkgdown/custom.css
    after_body: pkgdown/footer.html
    before_body: pkgdown/home.html

development:
  mode: auto

navbar:
  title: "canobsR"
  structure:
    left:  [articles, reference]
    right: [search, github, lightswitch]

reference:
- title: Installation
  contents:
  - canobs_setup
  - canobs_sitrep
  - canobs_config
  - canobs_install_odm
  - canobs_check_odm_gpu
  - canobs_install_metashape
  - canobs_activate_metashape
- title: Orthomosaics (Time-SIFT)
  contents:
  - check_flights
  - plan_mosaics
  - generate_mosaics
  - generate_Mosa
  - check_odm_epochs
- title: Co-registration
  contents:
  - align_mosaics
- title: Lighter mosaics and spectral indices
  contents:
  - aggregate_mosaics
  - rgb_indices
